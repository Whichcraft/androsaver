collections:
  source:
    path: ./app/src/main/java/com/androsaver
    pattern: "**/*.kt"
    context:
      /: "Core classes: ScreensaverService, ScreensaverEngine, SettingsActivity, Prefs (all SharedPreferences key constants — always use these, never raw strings), ImageCache, WeatherFetcher, HttpClients, UpdateChecker, UpdateInstaller, BootReceiver"
      /auth: "OAuth managers: GoogleAuthManager, OneDriveAuthManager, DropboxAuthManager"
      /source: "Image source implementations of ImageSource interface (getImageUrls): GoogleDriveSource, OneDriveSource, DropboxSource, ImmichSource, NextcloudSource, SynologySource, LocalStorageSource, DefaultImagesSource"
      /visualizer: "Audio visualizer pipeline: VisualizerView (GLSurfaceView) → AudioEngine (FFT analysis) + VisualizerRenderer (GL ES 2.0) → 18 mode classes. AudioData carries the audio snapshot per frame."
      /visualizer/modes: "18 OpenGL ES 2.0 visualizer effect classes: YantraMode, CubeMode, TriFluxMode, LissajousMode, TunnelMode, CorridorMode, NovaMode, SpiralMode, BubblesMode, PlasmaMode, BranchesMode, ButterfliesMode, FlowFieldMode, VortexMode, AuroraMode, LatticeMode, BarsMode, WaterfallMode — all extend BaseMode"
  docs:
    path: ./docs
    pattern: "**/*.md"
    context:
      /: "Reference docs: architecture.md (full class map), image-sources.md (auth patterns), visualizer-modes.md (effect specs), settings-reference.md (all Prefs keys + defaults), psysuals-port-notes.md (read before porting from psysuals)"
  root:
    path: .
    pattern: "*.md"
    ignore:
      - psysuals/**
    context:
      /: "Top-level project files: CLAUDE.md, CHANGELOG.md, README.md, visualizer-music-reactivity.md"
global_context: "Android TV screensaver app (Kotlin, Android 5+). Two modes: Photo Slideshow and Music Visualizer with 18 OpenGL ES 2.0 effects. Targets Android TV devices (Huawei TV Stick, Fire TV Stick). Entry: ScreensaverService (DreamService) → ScreensaverEngine."
