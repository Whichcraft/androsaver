name: Android CI/CD

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: androsaver-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run JVM tests
        run: ./gradlew test

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run JVM tests
        run: ./gradlew test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/androsaver.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ./gradlew assembleDevStandardRelease
          else
            ./gradlew assembleProdStandardRelease
          fi

      - name: Rename APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            mv app/build/outputs/apk/devStandard/release/*.apk app/build/outputs/apk/devStandard/release/androsaver.apk
          else
            mv app/build/outputs/apk/prodStandard/release/*.apk app/build/outputs/apk/prodStandard/release/androsaver.apk
          fi

      - name: Write version manifest
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_PATCH_BASE=$(grep -oP 'versionPatchBase\s*=\s*\K[0-9]+' app/build.gradle)
          VERSION_PREFIX=$(grep -oP 'versionName\s*"\K[0-9]+\.[0-9]+' app/build.gradle)
          VERSION_PATCH=$((VERSION_CODE - VERSION_PATCH_BASE))
          VERSION_NAME="${VERSION_PREFIX}.${VERSION_PATCH}"
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAG="dev"
            APK_DIR="dev"
          else
            TAG="stable"
            APK_DIR="prod"
          fi
          APK_URL="https://github.com/Whichcraft/androsaver/releases/download/${TAG}/androsaver.apk"
          APK_PATH="app/build/outputs/apk/${APK_DIR}Standard/release/androsaver.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c '%s' "$APK_PATH")
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s","sha256":"%s","sizeBytes":%s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$APK_SHA256" "$APK_SIZE" > version.json

      - name: Publish to dev release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Dev
          prerelease: true
          overwrite_files: true
          files: |
            app/build/outputs/apk/devStandard/release/androsaver.apk
            version.json

      - name: Move dev tag to published commit
        if: github.ref == 'refs/heads/dev'
        run: git push origin HEAD:refs/tags/dev --force

      - name: Verify dev release assets and tag
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          assets=$(gh release view dev --json assets --jq '[.assets[].name] | sort | join(" ")')
          case " $assets " in
            *" androsaver.apk "*) : ;;
            *) echo "Dev release assets are incomplete: $assets"; exit 1 ;;
          esac
          case " $assets " in
            *" version.json "*) : ;;
            *) echo "Dev release assets are incomplete: $assets"; exit 1 ;;
          esac
          test "$(jq -r .sha256 version.json)" = "$(sha256sum app/build/outputs/apk/devStandard/release/androsaver.apk | cut -d' ' -f1)"
          test "$(jq -r .sizeBytes version.json)" = "$(stat -c '%s' app/build/outputs/apk/devStandard/release/androsaver.apk)"
          test "$(gh api repos/${{ github.repository }}/git/ref/tags/dev --jq .object.sha)" = "${{ github.sha }}"

      - name: Publish to stable release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: stable
          target_commitish: ${{ github.sha }}
          name: Stable
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            app/build/outputs/apk/prodStandard/release/androsaver.apk
            version.json

      - name: Move stable tag to published commit
        if: github.ref == 'refs/heads/master'
        run: git push origin HEAD:refs/tags/stable --force

      - name: Verify stable release assets and tag
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          assets=$(gh release view stable --json assets --jq '[.assets[].name] | sort | join(" ")')
          case " $assets " in
            *" androsaver.apk "*) : ;;
            *) echo "Stable release assets are incomplete: $assets"; exit 1 ;;
          esac
          case " $assets " in
            *" version.json "*) : ;;
            *) echo "Stable release assets are incomplete: $assets"; exit 1 ;;
          esac
          test "$(jq -r .sha256 version.json)" = "$(sha256sum app/build/outputs/apk/prodStandard/release/androsaver.apk | cut -d' ' -f1)"
          test "$(jq -r .sizeBytes version.json)" = "$(stat -c '%s' app/build/outputs/apk/prodStandard/release/androsaver.apk)"
          test "$(gh api repos/${{ github.repository }}/git/ref/tags/stable --jq .object.sha)" = "${{ github.sha }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/androsaver.jks

  bundle-playstore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout master release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/androsaver.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdPlaystoreRelease

      - name: Rename AAB
        run: mv app/build/outputs/bundle/prodPlaystoreRelease/*.aab app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Publish AAB to playstore-stable release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: playstore-stable
          target_commitish: ${{ github.sha }}
          name: Playstore Stable
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Move playstore-stable tag to published commit
        run: git push origin HEAD:refs/tags/playstore-stable --force

      - name: Verify Play Store release asset and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          assets=$(gh release view playstore-stable --json assets --jq '[.assets[].name] | join(" ")')
          case " $assets " in
            *" androsaver.aab "*) : ;;
            *) echo "Play Store release asset is missing: $assets"; exit 1 ;;
          esac
          test "$(gh api repos/${{ github.repository }}/git/ref/tags/playstore-stable --jq .object.sha)" = "${{ github.sha }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/androsaver.jks
