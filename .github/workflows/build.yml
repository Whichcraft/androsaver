name: Android CI/CD

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: androsaver-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check release publication script
        run: |
          bash -n .github/scripts/publish-release.sh
          python3 .github/scripts/test_publish_release.py

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run JVM tests
        run: |
          for attempt in 1 2 3; do
            ./gradlew test && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check release publication script
        run: |
          bash -n .github/scripts/publish-release.sh
          python3 .github/scripts/test_publish_release.py

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run JVM tests
        run: |
          for attempt in 1 2 3; do
            ./gradlew test && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/androsaver.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ./gradlew assembleDevStandardRelease
          else
            ./gradlew assembleProdStandardRelease
          fi

      - name: Rename APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            mv app/build/outputs/apk/devStandard/release/*.apk app/build/outputs/apk/devStandard/release/androsaver.apk
          else
            mv app/build/outputs/apk/prodStandard/release/*.apk app/build/outputs/apk/prodStandard/release/androsaver.apk
          fi

      - name: Write version manifest
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_PATCH_BASE=$(grep -oP 'versionPatchBase\s*=\s*\K[0-9]+' app/build.gradle)
          VERSION_PREFIX=$(grep -oP 'versionName\s*"\K[0-9]+\.[0-9]+' app/build.gradle)
          VERSION_PATCH=$((VERSION_CODE - VERSION_PATCH_BASE))
          VERSION_NAME="${VERSION_PREFIX}.${VERSION_PATCH}"
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAG="dev-channel"
            APK_DIR="dev"
          else
            TAG="stable"
            APK_DIR="prod"
          fi
          APK_URL="https://github.com/Whichcraft/androsaver/releases/download/${TAG}/androsaver.apk"
          APK_PATH="app/build/outputs/apk/${APK_DIR}Standard/release/androsaver.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c '%s' "$APK_PATH")
          IMMUTABLE_APK_URL="https://github.com/Whichcraft/androsaver/releases/download/build-${TAG}-${{ github.sha }}/androsaver.apk"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s","immutableApkUrl":"%s","sha256":"%s","sizeBytes":%s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$IMMUTABLE_APK_URL" "$APK_SHA256" "$APK_SIZE" > version.json

      - name: Publish and verify APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            bash .github/scripts/publish-release.sh dev-channel app/build/outputs/apk/devStandard/release/androsaver.apk version.json
          else
            bash .github/scripts/publish-release.sh stable app/build/outputs/apk/prodStandard/release/androsaver.apk version.json
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/androsaver.jks"

  bundle-playstore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout master release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/androsaver.jks"

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdPlaystoreRelease

      - name: Rename AAB
        run: mv app/build/outputs/bundle/prodPlaystoreRelease/*.aab app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Publish and verify Play Store releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh playstore-stable app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/androsaver.jks"
