name: Android CI/CD

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: androsaver-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew test

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/androsaver.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ./gradlew assembleDevStandardRelease
          else
            ./gradlew assembleProdStandardRelease
          fi

      - name: Rename APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            mv app/build/outputs/apk/devStandard/release/*.apk app/build/outputs/apk/devStandard/release/androsaver.apk
          else
            mv app/build/outputs/apk/prodStandard/release/*.apk app/build/outputs/apk/prodStandard/release/androsaver.apk
          fi

      - name: Write version manifest
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_PATCH_BASE=$(grep -oP 'versionPatchBase\s*=\s*\K[0-9]+' app/build.gradle)
          VERSION_PREFIX=$(grep -oP 'versionName\s*"\K[0-9]+\.[0-9]+' app/build.gradle)
          VERSION_PATCH=$((VERSION_CODE - VERSION_PATCH_BASE))
          VERSION_NAME="${VERSION_PREFIX}.${VERSION_PATCH}"
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAG="dev"
            APK_DIR="dev"
          else
            TAG="stable"
            APK_DIR="prod"
          fi
          APK_URL="https://github.com/Whichcraft/androsaver/releases/download/${TAG}/androsaver.apk"
          APK_PATH="app/build/outputs/apk/${APK_DIR}Standard/release/androsaver.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c '%s' "$APK_PATH")
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s","sha256":"%s","sizeBytes":%s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$APK_SHA256" "$APK_SIZE" > version.json

      - name: Delete all existing dev releases
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "=== Releases before deletion ==="
          gh api repos/${{ github.repository }}/releases --jq '.[] | {name: .name, tag_name: .tag_name, id: .id, draft: .draft}'
          
          echo "Finding dev releases to delete..."
          IDS=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "dev" or .name == "Dev" or .name == "Dev Draft") | .id')
          
          if [ -n "$IDS" ]; then
            for id in $IDS; do
              echo "Deleting release ID: $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done
          else
            echo "No matching releases found to delete."
          fi
          
          echo "=== Releases after deletion ==="
          gh api repos/${{ github.repository }}/releases --jq '.[] | {name: .name, tag_name: .tag_name, id: .id, draft: .draft}'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Move dev tag to current commit
        if: github.ref == 'refs/heads/dev'
        run: git push origin HEAD:refs/tags/dev --force

      - name: Publish to dev release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev
          prerelease: true
          files: |
            app/build/outputs/apk/devStandard/release/androsaver.apk
            version.json

      - name: Move stable tag to current commit
        if: github.ref == 'refs/heads/master'
        run: git push origin HEAD:refs/tags/stable --force

      - name: Publish to stable release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: Stable
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/prodStandard/release/androsaver.apk
            version.json

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/androsaver.jks

  bundle-playstore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout master release commit
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/androsaver.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdPlaystoreRelease

      - name: Rename AAB
        run: mv app/build/outputs/bundle/prodPlaystoreRelease/*.aab app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Move playstore-stable tag to current commit
        run: git push origin HEAD:refs/tags/playstore-stable --force

      - name: Publish AAB to playstore-stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: playstore-stable
          name: Playstore Stable
          prerelease: false
          make_latest: false
          files: app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/androsaver.jks
