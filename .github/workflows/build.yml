name: Android CI/CD

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: androsaver-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check release publication script
        run: |
          bash -n .github/scripts/publish-release.sh
          python3 .github/scripts/test_publish_release.py

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Run JVM tests
        run: |
          for attempt in 1 2 3; do
            ./gradlew test && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

  build:
    needs: [verify, device-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check release publication script
        run: |
          bash -n .github/scripts/publish-release.sh
          python3 .github/scripts/test_publish_release.py

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/androsaver.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ./gradlew assembleDevStandardRelease
          else
            ./gradlew assembleProdStandardRelease
          fi

      - name: Rename APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            mv app/build/outputs/apk/devStandard/release/*.apk app/build/outputs/apk/devStandard/release/androsaver.apk
          else
            mv app/build/outputs/apk/prodStandard/release/*.apk app/build/outputs/apk/prodStandard/release/androsaver.apk
          fi

      - name: Write version manifest
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_PATCH_BASE_COMMIT=$(grep -oP "versionPatchBaseCommit\s*=\s*'\K[^']+" app/build.gradle)
          VERSION_PREFIX=$(grep -oP 'versionName\s*"\K[0-9]+\.[0-9]+' app/build.gradle)
          VERSION_PATCH_COUNT=$(git rev-list --count --no-merges --ancestry-path "${VERSION_PATCH_BASE_COMMIT}..HEAD")
          VERSION_PATCH=$((VERSION_PATCH_COUNT - 1))
          if [ "$VERSION_PATCH" -lt 0 ]; then VERSION_PATCH=0; fi
          VERSION_NAME="${VERSION_PREFIX}.${VERSION_PATCH}"
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAG="dev-channel"
            APK_DIR="dev"
          else
            TAG="stable"
            APK_DIR="prod"
          fi
          APK_URL="https://github.com/Whichcraft/androsaver/releases/download/${TAG}/androsaver.apk"
          APK_PATH="app/build/outputs/apk/${APK_DIR}Standard/release/androsaver.apk"
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_SIZE=$(stat -c '%s' "$APK_PATH")
          IMMUTABLE_APK_URL="https://github.com/Whichcraft/androsaver/releases/download/build-${TAG}-${{ github.sha }}/androsaver.apk"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s","immutableApkUrl":"%s","sha256":"%s","sizeBytes":%s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$IMMUTABLE_APK_URL" "$APK_SHA256" "$APK_SIZE" > version.json

      - name: Publish and verify APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            bash .github/scripts/publish-release.sh dev-channel app/build/outputs/apk/devStandard/release/androsaver.apk version.json
          else
            bash .github/scripts/publish-release.sh stable app/build/outputs/apk/prodStandard/release/androsaver.apk version.json
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/androsaver.jks"

  bundle-playstore:
    needs: [verify, device-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout master release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/androsaver.jks"

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/androsaver.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdPlaystoreRelease

      - name: Rename AAB
        run: mv app/build/outputs/bundle/prodPlaystoreRelease/*.aab app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Publish and verify Play Store releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh playstore-stable app/build/outputs/bundle/prodPlaystoreRelease/androsaver.aab

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/androsaver.jks"

  device-tests:
    name: Device integration (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - name: Run device integration tests
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod a+rw /dev/kvm
          sdk_ready=false
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "emulator" "system-images;android-${TEST_API};google_apis;x86_64"; then
              sdk_ready=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          if [ "$sdk_ready" != true ]; then exit 1; fi
          echo no | avdmanager create avd --force --name integration --package "system-images;android-${TEST_API};google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd integration -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat "$RUNNER_TEMP/emulator.log"; fi; adb emu kill || kill "$emulator_pid" || true; exit "$result"' EXIT
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          ./gradlew connectedDevStandardDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
