plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def gitVersionCode = {
    try {
        def process = 'git rev-list --count HEAD'.execute()
        process.waitFor()
        return process.text.trim().toInteger()
    } catch (ignored) {
        return 1
    }
}()

// Anchor the patch line to the parent of the 2.12.0 release commit. Counting
// only non-merge descendants keeps the patch at .0 when dev is merged to master.
def versionPatchBaseCommit = '3f3cf5bc99837d00205c327866b96c1598d55d6d'
def gitVersionPatch = {
    try {
        def process = "git rev-list --count --no-merges --ancestry-path ${versionPatchBaseCommit}..HEAD".execute()
        process.waitFor()
        return (process.text.trim().toInteger() - 1).coerceAtLeast(0)
    } catch (ignored) {
        return 0
    }
}()

android {
    namespace 'com.androsaver'
    compileSdk 35

    defaultConfig {
        applicationId "com.androsaver"
        minSdk 21
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode gitVersionCode
        versionName "2.12.${gitVersionPatch}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "androsaver.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    flavorDimensions "environment", "distribution"
    productFlavors {
        dev {
            dimension "environment"
            buildConfigField "boolean", "DEBUG_LOGGING", "true"
            buildConfigField "boolean", "IS_DEV", "true"
        }
        prod {
            dimension "environment"
            buildConfigField "boolean", "DEBUG_LOGGING", "false"
            buildConfigField "boolean", "IS_DEV", "false"
        }
        standard {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_STORE", "false"
        }
        playstore {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_STORE", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.leanback:leanback-preference:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
